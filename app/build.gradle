plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def releaseKeystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
def releaseSigningConfigured = [
        releaseKeystorePath,
        releaseKeystorePassword,
        releaseKeyAlias,
        releaseKeyPassword
].every { value -> value != null && !value.trim().isEmpty() }

android {
    namespace 'dev.zippio'
    compileSdk 35
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'dev.zippio'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.3.1'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def releasePackagingRequested = graph.allTasks.any { task ->
        task.path ==~ /.*:(assemble|bundle|package).*Release.*/
    }
    if (releasePackagingRequested && !releaseSigningConfigured) {
        throw new GradleException(
                'Release signing is not configured. Set ANDROID_KEYSTORE_PATH, ' +
                        'ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD.')
    }
}

dependencies {
    implementation 'net.lingala.zip4j:zip4j:2.11.6'
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'com.github.junrar:junrar:8.0.0'
    implementation 'com.sorrowblue.sevenzipjbinding:7-Zip-JBinding-4Android:16.02-2.03'
    implementation 'org.slf4j:slf4j-nop:2.0.17'

    testImplementation 'junit:junit:4.13.2'
}
