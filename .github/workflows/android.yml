name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and verify debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;36.0.0"

      - name: Build, test, and lint
        shell: pwsh
        run: ./build.ps1 -Mode Debug -OutputDirectory dist/ci

      - name: Verify APK signature, manifest, permissions, and checksum
        shell: pwsh
        run: >-
          ./scripts/Verify-Apk.ps1
          -ApkPath dist/ci/zippio-debug.apk
          -BuildToolsVersion 36.0.0
          -AllowedPermissions android.permission.POST_NOTIFICATIONS

      - name: Upload verified APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zippio-debug-${{ github.sha }}
          path: |
            dist/ci/zippio-debug.apk
            dist/ci/zippio-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
